name: "CodeQL"

on:
  push:
    branches: [main]
  # Per-PR CodeQL removed (2026-07-25): Eitri runs semgrep+trivy on each PR's diff,
  # so CodeQL on every forge PR to main was redundant and minute-heavy (the bulk of
  # the Actions bill). Keep the post-merge scan on main + the weekly deep sweep.
  schedule:
    - cron: "27 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          category: "/language:${{ matrix.language }}"
