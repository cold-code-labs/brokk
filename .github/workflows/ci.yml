name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The forge already runs typecheck+build (verify) on its own workers before it
    # opens a PR, and Eitri gates the merge on that green verify (BROKK-26). Re-running
    # CI on every brokk/* forge branch is therefore pure redundant Actions spend (and
    # it fails there anyway). Run CI on main pushes + human (non-forge) PRs only.
    if: ${{ github.event_name == 'push' || !startsWith(github.head_ref, 'brokk/') }}
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
        env:
          # auth to GitHub Packages for private @cold-code-labs/* deps
          # (yggdrasil) — same token Coolify uses at build time.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: pnpm typecheck
      - run: pnpm build
