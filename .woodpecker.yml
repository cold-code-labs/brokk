# Gate do brokk — Woodpecker único (pre-push local não roda CI).
# check em main ou quando toca código/deps (watch-paths do deploy ficam no Coolify).

when:
  - event: push

steps:
  - name: check
    image: node:22-alpine
    when:
      - branch: main
      - path:
          include:
            - apps/**
            - packages/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - tsconfig*.json
            - .woodpecker.yml
    environment:
      NODE_AUTH_TOKEN:
        from_secret: node_auth_token
    commands:
      - corepack enable
      - corepack prepare pnpm@9.15.0 --activate
      - pnpm install --no-frozen-lockfile
      - pnpm typecheck
      - pnpm build
